<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Robo Me</title>
<meta name="theme-color" content="#E9ECF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141729" media="(prefers-color-scheme: dark)">
<meta name="description" content="Mi Robo Me: my tasks, habits, journals and everything me.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Robo Me">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECF5; --dot:#C7CCE0; --paper:#FBFBFE; --ink:#1E2440; --muted:#646B8F;
  --line:#D3D8E8; --empty:#E3E6F1; --accent:#5A55D2; --accent-ink:#FFFFFF; --danger:#C2415B; --sea:#D8E2F6;
  --pink:#F49CBB; --yellow:#FFCF6B; --mint:#7FD3BB; --blue:#8FB0F5; --lilac:#BC9CF0; --peach:#FFAA80;
  --cherry:#F2727F; --lime:#A9D86E; --teal:#5EC6D6; --sand:#E3C79A; --orchid:#E08FD8; --slate:#A3ABC9;
  --pixel:'Pixelify Sans','Courier New',monospace;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141729; --dot:#252A4C; --paper:#1C2036; --ink:#E7E9F7; --muted:#9BA1C6;
    --line:#2E3354; --empty:#272C49; --accent:#8E89FF; --accent-ink:#141729; --danger:#FF7A93; --sea:#1F2A4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141729; --dot:#252A4C; --paper:#1C2036; --ink:#E7E9F7; --muted:#9BA1C6;
  --line:#2E3354; --empty:#272C49; --accent:#8E89FF; --accent-ink:#141729; --danger:#FF7A93; --sea:#1F2A4A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:18px 18px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 110px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:34px;height:auto;color:var(--ink);display:block}
.logo .eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
@media (prefers-reduced-motion:reduce){.logo .eyes{animation:none}}
.brand{font-family:var(--pixel);font-weight:700;font-size:22px;letter-spacing:.5px}

.paper{background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px;margin-bottom:18px}
h2{font-family:var(--pixel);font-weight:600;font-size:19px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.link{font-family:var(--body);font-size:13px;font-weight:500;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

.hello{margin:4px 0 18px}
.hgreet{font-family:var(--pixel);font-size:32px;font-weight:700;line-height:1.1}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.dayhead .mid{text-align:center;flex:1}
.dname{font-family:var(--pixel);font-size:32px;font-weight:700;line-height:1.05}
.ddate{color:var(--muted);font-size:14px}
.rel{display:inline-block;margin-top:4px;font-family:var(--pixel);font-size:13px;background:var(--accent);color:var(--accent-ink);padding:1px 8px}
.rel.go{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.arrow{flex:none;width:42px;height:42px;border:2px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-family:var(--pixel);font-size:22px;line-height:1}
.arrow:active,.pbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

.bar{display:flex;flex-wrap:wrap;gap:3px}
.bar i{width:14px;height:14px;background:var(--empty);border:1.5px solid var(--line)}
.bar i.on{background:var(--c,var(--mint));border-color:var(--ink)}
.strip .srow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;padding:4px 0}
.sl{font-family:var(--pixel);font-size:15px}
.sn{font-family:var(--pixel);font-size:15px;color:var(--muted)}

.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1.5px dashed var(--line)}
.task:last-child{border-bottom:0}
.box{flex:none;width:22px;height:22px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.box.on{background:var(--mint)}
.box.on::after{content:'';width:8px;height:8px;background:var(--ink)}
.ttext{flex:1;min-width:0;word-break:break-word}
.task.done .ttext{text-decoration:line-through;color:var(--muted)}
.task.ghost .ttext{color:var(--muted)}
.tag{font-size:11px;font-family:var(--pixel);color:var(--muted);border:1.5px solid var(--line);padding:0 6px;white-space:nowrap}
.x{flex:none;width:28px;height:28px;color:var(--muted);font-size:18px}
.x:hover{color:var(--danger)}
.addrow{display:flex;gap:8px;margin-top:10px}
.field{flex:1;min-width:0;border:2px solid var(--ink);background:var(--paper);padding:9px 10px;border-radius:0;width:100%}
textarea.field{resize:vertical;line-height:1.5}
.pbtn{border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);box-shadow:3px 3px 0 var(--ink);padding:8px 14px;font-family:var(--pixel);font-weight:600;font-size:15px;white-space:nowrap;display:inline-block;text-align:center}
.pbtn.ghost{background:var(--paper);color:var(--ink)}
.pbtn.small{padding:4px 10px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.pbtn.danger{background:var(--danger);color:#fff}
.pbtn.wide{width:100%}
.carry{flex:none;font-family:var(--pixel);font-size:13px;color:var(--accent);border:2px solid var(--accent);padding:1px 8px;white-space:nowrap}
.left{background:color-mix(in srgb,var(--yellow) 22%,var(--paper))}
.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--yellow) 30%,var(--paper));border:2px dashed var(--ink);padding:6px 10px;margin-bottom:8px;font-size:14px}
.banner span{flex:1}

.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--paper);padding:6px 10px 6px 6px;font-size:14px;text-align:left}
.hchip .sq{flex:none;width:20px;height:20px;border:2px solid var(--ink);background:var(--empty)}
.hchip.on .sq{background:var(--c)}
.hchip.on{box-shadow:3px 3px 0 var(--c)}
.hchip .st{font-family:var(--pixel);font-size:12px;color:var(--muted)}

.moodrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.moodrow .q{font-family:var(--pixel);font-size:17px}
.mini{display:flex;gap:6px}
.mini button{width:30px;height:30px;border:2px solid var(--ink);background:var(--mc);opacity:.35}
.mini button.on{opacity:1;box-shadow:2px 2px 0 var(--ink)}
.moodname{font-size:12px;color:var(--muted);text-align:right;margin-top:-10px;margin-bottom:14px}

.ev{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1.5px dashed var(--line)}
.ev:last-child{border-bottom:0}
.when{flex:none;font-family:var(--pixel);font-size:13px;background:var(--blue);color:#1E2440;border:2px solid var(--ink);padding:1px 6px;min-width:62px;text-align:center}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

.little{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.lt{background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--c,var(--ink));padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.lt b{font-family:var(--pixel);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.lt b i{width:10px;height:10px;background:var(--c);border:1.5px solid var(--ink)}
.lt span{font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.monthnav .mid{font-family:var(--pixel);font-size:24px;font-weight:700;text-align:center;flex:1}
.seg{display:flex;border:2px solid var(--ink);margin-bottom:16px;background:var(--paper)}
.seg button{flex:1;padding:7px 4px;font-family:var(--pixel);font-size:15px}
.seg button.on{background:var(--ink);color:var(--paper)}
.hcard{margin-bottom:16px}
.hname{display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-size:18px;font-weight:600;text-align:left}
.hname .dotc{width:14px;height:14px;background:var(--c);border:2px solid var(--ink)}
.hmeta{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:2px 0 10px}
.grid16{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.cell{aspect-ratio:1;min-width:0;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);font-size:10px;display:grid;place-items:center;background:var(--paper);color:var(--muted);font-family:var(--pixel)}
.cell.on{background:var(--c);color:#1E2440}
.cell.today{outline:2px solid var(--accent);outline-offset:-3px}
.cell.future{opacity:.35;cursor:default}
.cell.pad{background:var(--empty)}
.yearpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.yp{border:2px solid var(--ink);background:var(--paper);padding:3px 10px;font-size:13px}
.yp.on{background:var(--ink);color:var(--paper)}
.ygrid{display:grid;grid-template-columns:30px repeat(31,minmax(0,1fr));gap:1px;width:100%}
.ygrid .ml{font-family:var(--pixel);font-size:11px;color:var(--muted);display:flex;align-items:center;min-width:0}
.ygrid .dl{font-size:8px;color:var(--muted);text-align:center;font-family:var(--pixel);min-width:0;overflow:hidden}
.yc{display:block;aspect-ratio:1;min-width:0;width:100%;padding:0;background:var(--empty);border:1px solid var(--line)}
.yc.on{background:var(--c);border-color:var(--ink)}
.yc.no{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border:1.5px solid var(--ink);display:inline-block}

.veil{position:fixed;inset:0;background:rgba(10,12,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.veil.open{display:flex}
.sheet{width:100%;max-width:560px;background:var(--paper);border:2px solid var(--ink);border-bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{font-family:var(--pixel);font-size:21px;margin:0 0 8px}
.sheet label,.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border:2px solid var(--ink);background:var(--c)}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink);padding:3px 9px;font-size:13px;background:var(--bg)}
.chip.on{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:8px;margin-top:16px}
.row .pbtn{flex:1}
textarea.mono{min-height:120px;font-size:12px;font-family:monospace}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;padding:9px 2px 8px;font-family:var(--pixel);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg .f{fill:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;font-family:var(--pixel);z-index:60;display:none}

.roomhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.roomhead .t{font-family:var(--pixel);font-size:26px;font-weight:700;line-height:1.1}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.room{background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px}
.room .ico{display:grid;grid-template-columns:repeat(3,10px);gap:2px}
.room .ico i{width:10px;height:10px;background:var(--c);border:1.5px solid var(--ink)}
.room .ico i.o{background:transparent;border-color:transparent}
.room b{font-family:var(--pixel);font-size:18px;font-weight:600}
.room span{font-size:12px;color:var(--muted)}

.inline{border:0;border-bottom:2px dashed var(--line);background:transparent;padding:4px 0;width:100%;border-radius:0}
.inline:focus{outline:none;border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) 28px;gap:8px;align-items:center;padding:2px 0}
.kv .k{color:var(--cherry);font-weight:500}
.ratebar{display:flex;gap:4px;flex-wrap:wrap}
.ratebar button,.ratebar i{width:22px;height:22px;border:2px solid var(--ink);background:var(--empty);font-family:var(--pixel);font-size:11px;display:grid;place-items:center;color:var(--muted)}
.ratebar .on{background:var(--rc,var(--cherry));color:#1E2440}
.ratebar.sm i{width:12px;height:12px;border-width:1.5px}

.gp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--line);width:100%;text-align:left}
.gp:last-child{border-bottom:0}
.rnd{flex:none;font-family:var(--pixel);font-size:13px;background:var(--cherry);color:#1E2440;border:2px solid var(--ink);width:40px;text-align:center}
.gpn{flex:1;min-width:0}
.gpn b{display:block;font-weight:500}
.status{font-size:11px;font-family:var(--pixel);padding:0 6px;border:1.5px solid var(--ink)}
.status.Missed{background:var(--empty);color:var(--muted);border-color:var(--line)}
.status.live{background:var(--lime);color:#1E2440}
.status.later{background:var(--yellow);color:#1E2440}
.gptitle{font-family:var(--pixel);font-size:30px;font-weight:700;line-height:1.05}
.podium{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.pod{flex:1;text-align:center;font-size:13px;min-width:0}
.pod .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.pod b{display:grid;place-items:center;border:2px solid var(--ink);font-family:var(--pixel);font-size:20px;color:#1E2440}
.pod.p1 b{height:62px;background:var(--yellow)}
.pod.p2 b{height:46px;background:var(--slate)}
.pod.p3 b{height:34px;background:var(--peach)}
.facts{display:grid;gap:10px}
.fact .lbl{margin:0 0 2px}
.fact p{margin:0;white-space:pre-wrap;word-break:break-word}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);display:block;background:var(--empty)}
.photos button{padding:0}
.bigimg{width:100%;border:2px solid var(--ink);display:block}
.lastyear{background:color-mix(in srgb,var(--cherry) 14%,var(--paper))}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.note{background:var(--c);color:#1E2440;border:2px solid var(--ink);padding:10px;min-height:96px;font-size:14px;transform:rotate(var(--r));display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
.note .nt{text-align:left;word-break:break-word;color:inherit}
.note .mv{display:flex;justify-content:space-between}
.note .mv button{width:28px;height:24px;border:1.5px solid #1E2440;font-family:var(--pixel);color:#1E2440;background:rgba(255,255,255,.35)}
.note .mv button:disabled{opacity:.25}
.colhead{font-family:var(--pixel);font-size:20px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.colhead i{font-style:normal;font-size:13px;color:var(--muted);font-family:var(--body)}

.circles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.circ{aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--pixel);font-size:15px;background:var(--paper)}
.circ.on{background:var(--mint);color:#1E2440;text-decoration:line-through}

.jar{width:150px;margin:6px auto 14px;border:3px solid var(--ink);border-top-width:10px;padding:8px;min-height:150px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:3px;background:color-mix(in srgb,var(--blue) 10%,var(--paper))}
.jar i{width:14px;height:12px;border:1.5px solid var(--ink);background:var(--c)}
.opened{background:var(--c);color:#1E2440;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:22px 18px;margin-bottom:18px;font-size:18px;white-space:pre-wrap;line-height:1.5}
.opened small{display:block;font-size:12px;margin-bottom:8px;font-family:var(--pixel)}

.mapgrid{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));border:2px solid var(--ink);background:var(--sea)}
.tile{aspect-ratio:1;min-width:0;padding:0;border:0}
.tile.sea{background:var(--sea);background-image:radial-gradient(color-mix(in srgb,var(--blue) 50%,transparent) 1px,transparent 1.5px);background-size:6px 6px;cursor:default}
.tile.land{background:var(--paper);box-shadow:inset 0 0 0 .5px var(--line)}
.tile.own{background:var(--c);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.fac{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.fac:last-child{border-bottom:0}
.fac .sw{flex:none;width:22px;height:22px}
.listcard{text-align:left;width:100%;display:block}
.listcard b{font-family:var(--pixel);font-size:17px;font-weight:600;display:block}
.listcard span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock{font-family:var(--pixel);font-size:42px;text-align:center;margin:4px 0}
.tag.board{background:var(--yellow);color:#1E2440;border-color:var(--ink)}
.qa{border-left:3px solid var(--lilac);padding:2px 0 2px 10px;margin:12px 0}
.qa .qrow{display:flex;gap:8px;align-items:center}
.qa .qrow .inline{font-weight:500}
.olist{list-style:none;counter-reset:n;margin:0;padding:0}
.olist li{display:flex;gap:8px;align-items:center;counter-increment:n;padding:2px 0}
.olist li::before{content:counter(n) '.';font-family:var(--pixel);min-width:26px;color:var(--muted)}
.sec{font-family:var(--pixel);font-size:13px;color:var(--muted);margin:16px 0 6px}
.bigmoney{font-family:var(--pixel);font-size:44px;font-weight:700;line-height:1}
.bigmoney.neg{color:var(--danger)}
.mbar{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin:12px 0 4px}
.mbar i{aspect-ratio:1;background:var(--mint);border:1.5px solid var(--ink)}
.mbar i.sp{background:var(--empty);border-color:var(--line)}
.mbar i.over{background:var(--danger);border-color:var(--ink)}
.amt{flex:none;font-family:var(--pixel);font-size:16px;white-space:nowrap}
.amt.in{color:var(--accent)}
.mday{font-family:var(--pixel);font-size:13px;color:var(--muted);margin:14px 0 2px;display:flex;justify-content:space-between}

  body{padding-left:224px}
  .top{position:fixed;left:0;top:0;width:224px;padding:24px 20px;margin:0;z-index:41}
  nav.tabs{top:0;bottom:0;left:0;right:auto;width:224px;border-top:0;border-right:2px solid var(--ink);padding:calc(92px + env(safe-area-inset-top,0px)) 16px 24px}
  nav.tabs .in{flex-direction:column;gap:8px;max-width:none}

  .wrap{max-width:1180px;padding:36px 44px 60px}
  #main{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:26px;align-items:start}

  #main.j-daily > .paper, #main.j-lists > .paper, #main.j-persona > .paper,

  #main.r-board > section{grid-column:span 2}
  #main.t-home > .strip, #main > .paper.full{grid-column:1 / -1}

  .hello{margin-top:0}
  .hgreet{font-size:46px}
  .dname{font-size:42px}
  .little{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rooms{grid-template-columns:repeat(4,minmax(0,1fr))}
  .room{min-height:150px;transition:transform .12s, box-shadow .12s}
  .room:hover,.lt:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}

  .sheet{max-width:600px;border-bottom:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding-bottom:20px}
  .toast{bottom:32px;left:calc(50% + 112px)}

}

.done-on{font-size:11px;font-family:var(--pixel);opacity:.75}

  <header class="top">

      <rect x="1" y="2" width="10" height="8" fill="currentColor"/><rect x="0" y="4" width="1" height="3" fill="currentColor"/><rect x="11" y="4" width="1" height="3" fill="currentColor"/>

  <button data-act="go" data-tab="days"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="0" y="1" width="8" height="7" fill="currentColor"/><rect x="1" y="3" width="6" height="4" fill="var(--paper)"/><rect class="f" x="2" y="4" width="2" height="2" fill="currentColor"/><rect x="1" y="0" width="1" height="2" fill="currentColor"/><rect x="6" y="0" width="1" height="2" fill="currentColor"/></svg>Days</button>
  <button data-act="go" data-tab="habits"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="0" y="0" width="2" height="2" fill="currentColor"/><rect class="f" x="3" y="0" width="2" height="2" fill="currentColor"/><rect x="6" y="0" width="2" height="2" fill="currentColor"/><rect class="f" x="0" y="3" width="2" height="2" fill="currentColor"/><rect x="3" y="3" width="2" height="2" fill="currentColor"/><rect class="f" x="6" y="3" width="2" height="2" fill="currentColor"/><rect x="0" y="6" width="2" height="2" fill="currentColor"/><rect class="f" x="3" y="6" width="2" height="2" fill="currentColor"/><rect x="6" y="6" width="2" height="2" fill="currentColor"/></svg>Habits</button>
  <button data-act="go" data-tab="journal"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="1" y="0" width="6" height="8" fill="currentColor"/><rect x="2" y="1" width="4" height="6" fill="var(--paper)"/><rect class="f" x="3" y="2" width="2" height="1" fill="currentColor"/><rect x="3" y="4" width="2" height="1" fill="currentColor"/><rect x="0" y="1" width="1" height="1" fill="currentColor"/><rect x="0" y="3" width="1" height="1" fill="currentColor"/><rect x="0" y="5" width="1" height="1" fill="currentColor"/></svg>Journal</button>
  <button data-act="go" data-tab="more"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="0" y="0" width="3" height="3" fill="currentColor"/><rect class="f" x="5" y="0" width="3" height="3" fill="currentColor"/><rect class="f" x="0" y="5" width="3" height="3" fill="currentColor"/><rect x="5" y="5" width="3" height="3" fill="currentColor"/></svg>Rooms</button>
</div></nav>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= data ================= */
const KEY = 'mirobome.v1';
const COLORS = ['pink','yellow','mint','blue','lilac','peach','cherry','lime','teal','sand','orchid','slate'];
const MOODS = [{n:'Awful',c:'#7C83A8'},{n:'Low',c:'#9DB4EE'},{n:'Okay',c:'#B5E2D2'},{n:'Good',c:'#FFD37A'},{n:'Great',c:'#F49CBB'}];
const JAR = [
  {k:'happy',n:'Happy',c:'#7FD3BB'},{k:'sad',n:'Sad or upset',c:'#F49CBB'},{k:'worried',n:'Worried or anxious',c:'#FFCF6B'},
  {k:'angry',n:'Mad or angry',c:'#FFAA80'},{k:'look',n:'Unhappy with how I look',c:'#BC9CF0'},{k:'alone',n:'Alone',c:'#8FB0F5'},{k:'bored',n:'Bored',c:'#D5D9E6'}
];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LIST_IDEAS = ['Things I am / things I am not','Questions I want answered','Songs that remind me of childhood','Side characters I liked more than the main one','Favourite movie quotes','Things to do with a friend','Cool names','Current obsessions','Random things I learned'];
const PAGE_IDEAS = ['Letter to future me','My dream life','My dream room','A day I want to remember','What I believe in','Who I was a year ago'];
const PERSONA_Q = ['How they talk','What makes them laugh','What gets on their nerves','What they care about','What I think of them now','What I admire about them','What I’d never copy from them','Something I learned from them','Little things only an observer notices','Things they like'];
const FAV_KEYS = ['Animal','Colour','Season','Food','Drink','Movie','Show','Book','Song','Game','App','City','Dream trip','YouTuber','Snack','Subject'];
const PROMPTS = ['What was the best part of today?','What is one thing you learned today?','How do you want to show up tomorrow?','What are three things you are grateful for?','Rate today and explain the rating.','What would make tomorrow great?'];
const GP_STATUS = ['Watched live','Watched later','Missed'];
const MCATS = ['Food','Transport','Recharge','Study','Fun','Gift','Other'];
const MAP_W = 18, MAP_H = 24;

function blank(){ return {
  profile:{name:'',birthday:'',from:'',quote:''}, favs:[], tops:[],
  tasks:{}, events:[], habits:[], checks:{}, mood:{},
  daily:{}, wish:[], lists:[], persona:null,
  f1:{seasons:{}, gps:[]}, jar:[], savings:[], money:{sessions:[]}, board:[], map:{factions:[], tiles:{}},
  theme:'auto'
};}
function load(){
  try{ const r = localStorage.getItem(KEY); if (r){ const d = Object.assign(blank(), JSON.parse(r)); d.profile = Object.assign(blank().profile, d.profile); d.f1 = Object.assign({seasons:{},gps:[]}, d.f1); d.map = Object.assign({factions:[],tiles:{}}, d.map); d.money = Object.assign({sessions:[]}, d.money);
    d.lists.forEach(l => { if (!l.type){ l.type = 'list'; l.items = (l.body||'').split('\n').filter(x => x.trim()).map(t => ({id:Math.random().toString(36).slice(2,10), t})); delete l.body; } });
    return d; } }catch(e){}
  return blank();
}
let S = load();
function save(){ S._ts = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Storage is full'); } if (typeof syncSoon === 'function') syncSoon(); }
let saveT; function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 350); }

/* ================= sync (GitHub Gist) ================= */
const SYNC_KEY = 'mirobome.sync', GIST_FILE = 'mirobome.json';
let SY = {}; try { SY = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); } catch(e){}
const saveSy = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch(e){} };
let syncReady = false, syncBusy = false, syncT = null, syncState = '';
async function gh(path, opts){
  opts = opts || {};
  const r = await fetch('https://api.github.com'+path, {method:opts.method||'GET', body:opts.body,
    headers:Object.assign({'Authorization':'Bearer '+SY.token, 'Accept':'application/vnd.github+json'}, opts.body ? {'Content-Type':'application/json'} : {})});
  if (!r.ok) throw new Error(r.status === 401 ? 'Token not accepted' : 'GitHub said '+r.status);
  return r.json();
}
async function syncPullRemote(){
  const g = await gh('/gists/'+SY.gist), f = g.files[GIST_FILE];
  if (!f) return null;
  const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return txt ? JSON.parse(txt) : null;
}
async function syncPush(){
  if (!SY.token || !SY.gist || !syncReady) return;
  syncBusy = true;
  try { await gh('/gists/'+SY.gist, {method:'PATCH', body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(S)}}})}); SY.last = Date.now(); saveSy(); syncState = ''; }
  catch(e){ syncState = e.message; }
  syncBusy = false;
}
function syncSoon(){ if (!SY.token || !SY.gist || !syncReady) return; clearTimeout(syncT); syncT = setTimeout(syncPush, 3000); }
async function syncNow(silent){
  if (!SY.token || !SY.gist || syncBusy) return;
  syncBusy = true;
  try {
    const remote = await syncPullRemote();
    syncReady = true; syncBusy = false;
    if (remote && (remote._ts||0) > (S._ts||0)){
      localStorage.setItem(KEY, JSON.stringify(remote)); S = load(); pLock(); applyTheme(); SY.last = Date.now(); saveSy();
      if (!$('veil').classList.contains('open')) render();
      if (!silent) toast('Synced from your other device');
    } else if (!remote || (remote._ts||0) < (S._ts||0)){ await syncPush(); if (!silent) toast('Synced'); }
    else { SY.last = Date.now(); saveSy(); if (!silent) toast('Already up to date'); }
    syncState = '';
  } catch(e){ syncBusy = false; syncState = e.message; if (!silent) toast(e.message); }
}
async function syncConnect(token){
  SY = {token}; 
  const gists = await gh('/gists?per_page=100');
  const found = gists.find(g => g.files && g.files[GIST_FILE]);
  if (found){
    SY.gist = found.id; saveSy();
    const remote = await syncPullRemote();
    if (remote){ localStorage.setItem(KEY, JSON.stringify(remote)); S = load(); pLock(); applyTheme(); }
    SY.last = Date.now(); saveSy(); syncReady = true; return;
  } else { const g = await gh('/gists', {method:'POST', body:JSON.stringify({description:'Mi Robo Me data', public:false, files:{[GIST_FILE]:{content:JSON.stringify(S)}}})}); SY.gist = g.id; }
  saveSy(); syncReady = false; await syncNow(true); syncReady = true;
}

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = parse(k); d.setDate(d.getDate()+n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayDiff = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const shortDay = k => { const d = parse(k); return d.getDate()+' '+MONTHS[d.getMonth()]; };
const hash = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); };
const pick = (arr, seed) => arr[hash(seed) % arr.length];
const taka = n => '৳'+Number(n).toLocaleString('en-IN');

function relLabel(k){
  const d = dayDiff(k, todayKey());
  if (d === 0) return 'Today'; if (d === -1) return 'Yesterday'; if (d === 1) return 'Tomorrow';
  return d < 0 ? (-d)+' days ago' : 'In '+d+' days';
}
function fmtTime(t){ if (!t) return 'All day'; const [h,m] = t.split(':').map(Number); return ((h%12)||12)+':'+pad(m)+(h<12?' am':' pm'); }
function streak(h){ const c = S.checks[h.id]||{}; let k = todayKey(); if (!c[k]) k = addDays(k,-1); let n = 0; while (c[k]){ n++; k = addDays(k,-1); } return n; }
function leftovers(){
  const t = todayKey(), out = [];
  for (let i = 1; i <= 14; i++){ const k = addDays(t,-i); (S.tasks[k]||[]).forEach(x => { if (!x.done && !x.moved && !x.skipped) out.push({k,x}); }); }
  return out;
}
function copyTask(k,id){
  const x = (S.tasks[k]||[]).find(y => y.id === id); if (!x) return;
  x.moved = true; const t = todayKey();
  (S.tasks[t] = S.tasks[t]||[]).push({id:uid(), text:x.text, done:false});
}
function setPath(path, val, root){
  const segs = path.split('.'); let o = root || S;
  for (let i = 0; i < segs.length-1; i++){
    const s = segs[i];
    if (s[0] === '#'){ o = o.find(x => x.id === s.slice(1)); if (!o) return; }
    else { if (o[s] == null) o[s] = {}; o = o[s]; }
  }
  o[segs[segs.length-1]] = val;
}
function dayHead(k, actPrev, actNext, actToday){
  const date = parse(k), isToday = k === todayKey();
  return `<section class="dayhead">
    <button class="arrow" data-act="${actPrev}" aria-label="Previous day">&lsaquo;</button>
    <div class="mid"><div class="dname">${date.toLocaleDateString('en-GB',{weekday:'long'})}</div>
      <div class="ddate">${date.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</div>
      ${isToday ? `<span class="rel">Today</span>` : `<button class="rel go" data-act="${actToday}">${relLabel(k)}, back to today</button>`}</div>
    <button class="arrow" data-act="${actNext}" aria-label="Next day">&rsaquo;</button></section>`;
}
function roomHead(title, back){
  return `<div class="roomhead"><button class="arrow" data-act="${back||'roomBack'}" aria-label="Back">&lsaquo;</button><div class="t">${esc(title)}</div></div>`;
}

/* ================= images (IndexedDB) ================= */
const IMG = {
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej) => { const r = indexedDB.open('mirobome-img',1); r.onupgradeneeded = () => r.result.createObjectStore('img'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res,rej) => { const t = db.transaction('img',mode); const st = t.objectStore('img'); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  put(id,data){ return this.tx('readwrite', st => st.put(data,id)); },
  get(id){ return this.tx('readonly', st => st.get(id)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); }
};
function fillImgs(){ document.querySelectorAll('img[data-img]').forEach(im => { IMG.get(im.dataset.img).then(d => { if (d) im.src = d; }).catch(()=>{}); }); }
function compress(file){
  return new Promise((res,rej) => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, 1000/Math.max(im.width, im.height)); const c = document.createElement('canvas');
    c.width = Math.round(im.width*s); c.height = Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.78)); }; im.onerror = rej; im.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); });
}

/* ================= Persona encryption ================= */
let P = {key:null, list:null};
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function pSave(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, P.key, new TextEncoder().encode(JSON.stringify(P.list)));
  S.persona.iv = b64(iv); S.persona.data = b64(new Uint8Array(ct)); save();
}
let pT = null;
function pSaveSoon(ms){ clearTimeout(pT); pT = setTimeout(() => { pT = null; if (P.key) pSave(); }, ms == null ? 600 : ms); }
function pLock(){ if (pT){ clearTimeout(pT); pT = null; if (P.key) pSave(); } P.key = null; P.list = null; if (typeof view !== 'undefined') view.personId = null; }

/* ================= view state ================= */
let view = { tab:'home', room:null, day:todayKey(), month:todayKey().slice(0,7), mode:'month', yearOf:null,
  j:'daily', jday:todayKey(), listId:null, season:String(new Date().getFullYear()), gpId:null, jarOpen:null, paint:null };
let lastToday = todayKey();

/* ================= HOME ================= */
const boardPending = () => S.board.filter(n => n.col === 1);
function taskList(k, home){
  const tasks = S.tasks[k]||[], past = k < todayKey();
  const shown = home ? tasks.filter(x => !x.skipped && !x.moved) : tasks;
  const pend = k === todayKey() ? boardPending() : [];
  if (!shown.length && !pend.length) return `<ul class="list"><li class="empty">${home ? 'No tasks yet. Add your first one.' : 'Nothing planned for this day.'}</li></ul>`;
  return `<ul class="list">${pend.map(n => `<li class="task"><button class="box" data-act="boardDone" data-id="${n.id}" aria-label="Done"></button><span class="ttext">${esc(n.text)}</span><span class="tag board">Board</span></li>`).join('')}${shown.map(x => {
    if (x.moved) return `<li class="task ghost"><span class="tag">copied</span><span class="ttext">${esc(x.text)}</span></li>`;
    if (x.skipped) return `<li class="task ghost done"><span class="tag">let go</span><span class="ttext">${esc(x.text)}</span></li>`;
    return `<li class="task ${x.done?'done':''}"><button class="box ${x.done?'on':''}" data-act="toggleTask" data-k="${k}" data-id="${x.id}" aria-label="Done"></button>
      <span class="ttext">${esc(x.text)}</span>${x.board ? '<span class="tag board">Board</span>' : ''}
      ${past && !x.done ? `<button class="carry" data-act="copy" data-k="${k}" data-id="${x.id}">Copy to today</button>` : ''}
      <button class="x" data-act="delTask" data-k="${k}" data-id="${x.id}" aria-label="Delete">×</button></li>`;
  }).join('')}</ul>`;
}
const addTaskRow = k => `<div class="addrow"><input class="field" id="taskIn" data-k="${k}" placeholder="Add a task" maxlength="200" enterkeyhint="done"><button class="pbtn" data-act="addTask">Add</button></div>`;
function evRow(e, showDate){
  return `<div class="ev"><span class="when">${showDate ? shortDay(e.date) : fmtTime(e.time)}</span>
    <span class="ttext">${esc(e.title)}${showDate && e.time ? ` <span class="muted">${fmtTime(e.time)}</span>` : ''}</span>
    <button class="x" data-act="delEvent" data-id="${e.id}" aria-label="Delete">×</button></div>`;
}
function habitChips(k, showStreak){
  if (!S.habits.length) return `<div class="empty">No habits yet. <button class="link" data-act="go" data-tab="habits">Set them up</button></div>`;
  return `<div class="hchips">${S.habits.map(x => { const on = (S.checks[x.id]||{})[k], st = streak(x);
    return `<button class="hchip ${on?'on':''}" style="--c:var(--${x.color})" data-act="check" data-id="${x.id}" data-k="${k}"><span class="sq"></span>${esc(x.name)}${showStreak && st ? `<span class="st">${st}d</span>` : ''}</button>`; }).join('')}</div>`;
}
function renderHome(){
  const t = todayKey(), hr = new Date().getHours();
  const greet = hr<5 ? 'Up late' : hr<12 ? 'Good morning' : hr<17 ? 'Good afternoon' : hr<21 ? 'Good evening' : 'Good night';
  const name = S.profile.name.trim();
  const tasks = (S.tasks[t]||[]).filter(x => !x.skipped && !x.moved).concat(boardPending().map(() => ({done:false}))), done = tasks.filter(x => x.done).length;
  const hDone = S.habits.filter(x => (S.checks[x.id]||{})[t]).length;
  const lo = leftovers(), mv = S.mood[t]||0;

  let h = `<section class="hello"><div class="hgreet">${greet}${name ? ', '+esc(name) : ''}</div>
    <div class="ddate">${parse(t).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div></section>`;

  h += `<section class="paper strip">
    <div class="srow"><span class="sl">Tasks</span><div class="bar">${tasks.length ? tasks.map(x=>`<i class="${x.done?'on':''}"></i>`).join('') : '<i></i>'}</div><span class="sn">${done}/${tasks.length}</span></div>
    <div class="srow"><span class="sl">Habits</span><div class="bar">${S.habits.length ? S.habits.map(x=>`<i class="${(S.checks[x.id]||{})[t]?'on':''}" style="--c:var(--${x.color})"></i>`).join('') : '<i></i>'}</div><span class="sn">${hDone}/${S.habits.length}</span></div>
  </section>`;

  h += `<section class="paper"><h2>Today’s tasks <button class="link" data-act="go" data-tab="days">Open day</button></h2>`;
  if (lo.length) h += `<div class="banner"><span>${lo.length} unfinished from before</span><button class="carry" data-act="copyAll">Copy all</button><button class="carry" data-act="go" data-tab="days">Pick</button></div>`;
  h += taskList(t, true) + addTaskRow(t) + `</section>`;

  const evs = S.events.filter(e => e.date === t).sort((a,b) => (a.time||'').localeCompare(b.time||''));
  const soon = S.events.filter(e => e.date > t).sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,3);
  h += `<section class="paper"><h2>Plans <button class="pbtn small ghost" data-act="newEvent" data-k="${t}">+ Plan</button></h2>
    ${evs.length ? evs.map(e => evRow(e)).join('') : `<div class="empty">Nothing planned today.</div>`}
    ${soon.length ? `<div class="muted" style="margin:12px 0 2px">Next up</div>${soon.map(e => evRow(e,true)).join('')}` : ''}</section>`;

  h += `<section class="paper"><h2>Habits</h2>${habitChips(t, true)}</section>`;

  h += `<section class="paper moodrow"><span class="q">How’s today?${mv ? `<span class="muted" style="display:block;font-family:var(--body)">Feeling ${MOODS[mv-1].n.toLowerCase()}</span>` : ''}</span><div class="mini">${MOODS.map((m,i) => `<button class="${mv===i+1?'on':''}" style="--mc:${m.c}" data-act="mood" data-v="${i+1}" aria-label="${m.n}" title="${m.n}"></button>`).join('')}</div></section>`;

  const tiles = [];
  const jd = S.daily[t]||{}, wrote = Object.values(jd).some(v => String(v).trim());
  tiles.push(`<button class="lt" style="--c:var(--lilac)" data-act="go" data-tab="journal" data-j="daily"><b><i></i>Journal</b><span>${wrote ? 'Written today. Nice.' : esc(pick(PROMPTS, t))}</span></button>`);
  const wl = S.wish.filter(w => !w.done);
  if (wl.length) tiles.push(`<button class="lt" style="--c:var(--peach)" data-act="go" data-tab="journal" data-j="wish"><b><i></i>Someday</b><span>${esc(pick(wl, t).text)}</span></button>`);
  const cur = S.board.filter(n => n.col === 1);
  if (cur.length) tiles.push(`<button class="lt" style="--c:var(--yellow)" data-act="go" data-tab="more" data-room="board"><b><i></i>Working on</b><span>${esc(cur.map(n=>n.text).join(', '))}</span></button>`);
  const mss = activeSessions();
  if (mss.length) tiles.push(`<button class="lt" style="--c:var(--lime)" data-act="go" data-tab="more" data-room="money"><b><i></i>Money</b><span>${mss.map(m => esc(m.title || 'Mine')+': '+taka(moneyLeft(m))).join(', ')}</span></button>`);
  const sv = S.savings.find(s => s.filled.some(f=>!f));
  if (sv){ const got = sv.amounts.reduce((a,v,i)=>a+(sv.filled[i]?v:0),0);
    tiles.push(`<button class="lt" style="--c:var(--mint)" data-act="go" data-tab="more" data-room="save"><b><i></i>Savings</b><span>${taka(got)} of ${taka(sv.target)} in ${esc(sv.title)}</span></button>`); }
  const lastGp = S.f1.gps.filter(g => g.date && g.date <= t).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (lastGp) tiles.push(`<button class="lt" style="--c:var(--cherry)" data-act="openGp" data-id="${lastGp.id}"><b><i></i>Last GP</b><span>${esc(lastGp.name)}${lastGp.rating ? ', '+lastGp.rating+'/10' : ''}</span></button>`);
  if (S.jar.length) tiles.push(`<button class="lt" style="--c:var(--blue)" data-act="go" data-tab="more" data-room="jar"><b><i></i>Mood jar</b><span>${S.jar.length} note${S.jar.length>1?'s':''} waiting for you</span></button>`);
  h += `<div class="little">${tiles.slice(0,4).join('')}</div>`;
  return h;
}

/* ================= DAYS ================= */
function renderDays(){
  const d = view.day, t = todayKey(), isToday = d === t;
  const tasks = S.tasks[d]||[], active = tasks.filter(x => !x.moved && !x.skipped).concat(isToday ? boardPending().map(() => ({done:false})) : []), done = active.filter(x => x.done).length;
  let h = dayHead(d, 'prev', 'next', 'goToday');
  if (isToday){
    const lo = leftovers();
    if (lo.length) h += `<section class="paper left"><h2>Left from before <button class="pbtn small" data-act="copyAll">Copy all</button></h2>
      <ul class="list">${lo.map(({k,x}) => `<li class="task"><span class="tag">${relLabel(k)==='Yesterday'?'Yesterday':shortDay(k)}</span><span class="ttext">${esc(x.text)}</span>
        <button class="carry" data-act="copy" data-k="${k}" data-id="${x.id}">Copy</button>
        <button class="x" data-act="dismiss" data-k="${k}" data-id="${x.id}" aria-label="Let it go">×</button></li>`).join('')}</ul></section>`;
  }
  const unfinishedPast = d < t && tasks.some(x => !x.done && !x.moved && !x.skipped);
  h += `<section class="paper"><h2>Tasks <small>${active.length ? done+' of '+active.length+' done' : ''}</small></h2>
    ${active.length ? `<div class="bar" style="margin-bottom:10px">${active.map(x=>`<i class="${x.done?'on':''}"></i>`).join('')}</div>` : ''}
    ${taskList(d, false)}
    ${unfinishedPast ? `<button class="pbtn ghost small" style="margin-top:10px" data-act="copyDay" data-k="${d}">Copy all unfinished to today</button>` : ''}
    ${addTaskRow(d)}</section>`;
  const evs = S.events.filter(e => e.date === d).sort((a,b) => (a.time||'').localeCompare(b.time||''));
  h += `<section class="paper"><h2>Plans <button class="pbtn small ghost" data-act="newEvent" data-k="${d}">+ Plan</button></h2>
    ${evs.length ? evs.map(e => evRow(e)).join('') : `<div class="empty">No plans on this day.</div>`}`;
  if (isToday){
    const soon = S.events.filter(e => e.date > d && dayDiff(e.date,d) <= 30).sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
    if (soon.length) h += `<div class="muted" style="margin:14px 0 2px">Coming up</div>${soon.map(e => evRow(e,true)).join('')}`;
  }
  return h + `</section>`;
}

/* ================= HABITS ================= */
function renderHabits(){
  const [y,m] = view.month.split('-').map(Number), t = todayKey();
  let h = `<section class="monthnav"><button class="arrow" data-act="mprev" aria-label="Previous">&lsaquo;</button>
    <div class="mid">${view.mode==='month' ? new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}) : y}</div>
    <button class="arrow" data-act="mnext" aria-label="Next">&rsaquo;</button></section>
    <div class="seg"><button class="${view.mode==='month'?'on':''}" data-act="mode" data-v="month">Month</button><button class="${view.mode==='year'?'on':''}" data-act="mode" data-v="year">Year in pixels</button></div>`;
  if (view.mode === 'month'){
    const dim = new Date(y,m,0).getDate();
    if (!S.habits.length) h += `<section class="paper"><h2>No habits yet</h2><p class="muted" style="margin:0">Add one, then fill a pixel every day you do it. Habits stay every day, so you only set them up once.</p></section>`;
    S.habits.forEach(x => {
      const c = S.checks[x.id]||{}; let cnt = 0, cells = '';
      for (let i = 1; i <= 32; i++){
        if (i > dim){ cells += `<span class="cell pad"></span>`; continue; }
        const k = y+'-'+pad(m)+'-'+pad(i), on = !!c[k], fut = k > t; if (on) cnt++;
        cells += `<button class="cell ${on?'on':''} ${k===t?'today':''} ${fut?'future':''}" ${fut?'disabled':''} data-act="check" data-id="${x.id}" data-k="${k}" aria-label="Day ${i}">${i}</button>`;
      }
      h += `<section class="paper hcard" style="--c:var(--${x.color})"><button class="hname" data-act="editHabit" data-id="${x.id}"><span class="dotc"></span>${esc(x.name)}</button>
        <div class="hmeta"><span>${cnt} of ${dim} days</span><span>Streak ${streak(x)}</span></div><div class="grid16">${cells}</div></section>`;
    });
    h += `<button class="pbtn wide" data-act="newHabit">+ Add habit</button>`;
  } else {
    const opts = [{id:'mood',name:'Mood'}].concat(S.habits);
    if (!view.yearOf || !opts.find(o => o.id === view.yearOf)) view.yearOf = S.habits[0] ? S.habits[0].id : 'mood';
    const sel = opts.find(o => o.id === view.yearOf);
    h += `<div class="yearpick">${opts.map(o => `<button class="yp ${o.id===view.yearOf?'on':''}" data-act="yearOf" data-id="${o.id}">${esc(o.name)}</button>`).join('')}</div>`;
    let g = `<span></span>`;
    for (let dd = 1; dd <= 31; dd++) g += `<span class="dl">${dd===1||dd%5===0?dd:''}</span>`;
    for (let mo = 1; mo <= 12; mo++){
      const dim = new Date(y,mo,0).getDate();
      g += `<span class="ml">${MONTHS[mo-1]}</span>`;
      for (let dd = 1; dd <= 31; dd++){
        if (dd > dim){ g += `<span class="yc no"></span>`; continue; }
        const k = y+'-'+pad(mo)+'-'+pad(dd);
        if (sel.id === 'mood'){ const v = S.mood[k]; g += `<span class="yc ${v?'on':''}" ${v?`style="--c:${MOODS[v-1].c}"`:''}></span>`; }
        else { const on = (S.checks[sel.id]||{})[k];
          g += k > t ? `<span class="yc" style="opacity:.4"></span>` : `<button class="yc ${on?'on':''}" style="--c:var(--${sel.color})" data-act="check" data-id="${sel.id}" data-k="${k}" aria-label="${k}"></button>`; }
      }
    }
    h += `<section class="paper"><div class="ygrid">${g}</div>`;
    h += sel.id === 'mood' ? `<div class="legend">${MOODS.map(m => `<span><i style="background:${m.c}"></i>${m.n}</span>`).join('')}</div>`
      : `<div class="legend"><span>${Object.keys(S.checks[sel.id]||{}).filter(k => k.startsWith(String(y))).length} days in ${y}</span><span>Streak ${streak(sel)}</span></div>`;
    h += `</section>`;
  }
  return h;
}

function renderJournal(){
  const tabs = [['daily','Daily'],['persona','Persona'],['wish','Wishlist'],['lists','Notebook']];
  let h = `<div class="seg">${tabs.map(([k,n]) => `<button class="${view.j===k?'on':''}" data-act="jtab" data-v="${k}">${n}</button>`).join('')}</div>`;
  if (view.j === 'daily') h += renderDaily();
  else if (view.j === 'persona') h += renderPersona();

  return h;
}

/* ---- Savings ---- */
function makeAmounts(target, days){
  let step = target >= days*100 ? 50 : target >= days*20 ? 10 : 1;
  let units = Math.floor(target/step);
  const a = new Array(days).fill(1); let rest = units - days;
  while (rest > 0){ const i = Math.floor(Math.random()*days), add = Math.min(rest, 1+Math.floor(Math.random()*3)); a[i] += add; rest -= add; }
  const out = a.map(u => u*step); out[Math.floor(Math.random()*days)] += target - units*step;
  return out;
}
function renderSave(){

  h += S.savings.map(s => { const got = s.amounts.reduce((a,v,i) => a+(s.filled[i]?v:0), 0), pct = Math.round(got/s.target*100);

/* ---- Map ---- */
function isLand(x,y){
  const nx = (x-(MAP_W-1)/2)/(MAP_W/2), ny = (y-(MAP_H-1)/2)/(MAP_H/2), d = nx*nx*.9 + ny*ny;
  const n = Math.sin(x*1.3+y*.7)*.5 + Math.sin(x*.4-y*1.1)*.5 + Math.cos(x*.9+y*.5)*.4 + Math.sin(y*.55)*.3;
  return (1-1.25*d) + .45*n > .2;
}
function renderMap(){
  const F = S.map.factions;
  let h = roomHead('The Map');
  let g = '';
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++){
    if (!isLand(x,y)){ g += `<span class="tile sea"></span>`; continue; }
    const own = F.find(f => f.id === S.map.tiles[x+','+y]);
    g += `<button class="tile ${own?'own':'land'}" ${own?`style="--c:var(--${own.color})"`:''} data-act="paint" data-v="${x},${y}" aria-label="Land ${x},${y}"></button>`;

/* ---- Money ---- */
const activeSessions = () => S.money.sessions.filter(m => !m.end);
const activeSession = () => { const a = activeSessions(); return a.find(m => m.id === view.msess) || a[0]; };
const moneyIn = m => m.entries.filter(e => e.type === 'in').reduce((a,e) => a+e.amt, 0);
const moneyOut = m => m.entries.filter(e => e.type !== 'in').reduce((a,e) => a+e.amt, 0);
const moneyLeft = m => moneyIn(m) - moneyOut(m);
const fmtAt = iso => { const d = new Date(iso); return d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',hour12:true}); };
function moneyEntries(m, editable){
  const byDay = {};
  m.entries.slice().sort((a,b) => b.at.localeCompare(a.at)).forEach(e => { const k = keyOf(new Date(e.at)); (byDay[k] = byDay[k]||[]).push(e); });
  const days = Object.keys(byDay).sort().reverse();
  if (!days.length) return `<div class="empty">Nothing spent yet.</div>`;
  return days.map(k => { const out = byDay[k].filter(e => e.type !== 'in').reduce((a,e) => a+e.amt, 0);
    return `<div class="mday"><span>${relLabel(k)==='Today'||relLabel(k)==='Yesterday' ? relLabel(k) : shortDay(k)}</span><span>${out ? '−'+taka(out) : ''}</span></div><ul class="list">${byDay[k].map(e => `<li class="task">
      <span class="ttext">${esc(e.note || (e.type==='in' ? 'Got money' : 'Spent'))} ${e.cat ? `<span class="tag">${esc(e.cat)}</span>` : ''} <span class="muted">${fmtAt(e.at)}</span></span>
      <span class="amt ${e.type==='in'?'in':''}">${e.type==='in' ? '+' : '−'}${taka(e.amt)}</span>
      ${editable ? `<button class="x" data-act="mDel" data-id="${e.id}" aria-label="Delete">×</button>` : ''}</li>`).join('')}</ul>`; }).join('');
}
function moneySummary(m){
  const got = moneyIn(m), spent = moneyOut(m), left = got - spent;
  const days = Math.max(1, dayDiff(m.end || todayKey(), m.start) + 1);
  const spentBlocks = got ? Math.min(20, Math.round(spent/got*20)) : 0;
  const cats = {}; m.entries.filter(e => e.type !== 'in').forEach(e => { const c = e.cat || 'Other'; cats[c] = (cats[c]||0) + e.amt; });
  const top = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  return `<section class="paper">
    <div class="muted">${left < 0 ? 'Over budget by' : 'Left'}</div>
    <div class="bigmoney ${left<0?'neg':''}">${taka(Math.abs(left))}</div>
    <div class="mbar">${Array.from({length:20}, (_,i) => `<i class="${left<0 ? 'over' : i < spentBlocks ? 'sp' : ''}"></i>`).join('')}</div>
    <p class="muted" style="margin:6px 0 0">Spent ${taka(spent)} of ${taka(got)}. ${days} day${days>1?'s':''} since ${shortDay(m.start)}, about ${taka(Math.round(spent/days))} a day.</p>
    ${top.length ? `<div style="margin-top:12px">${top.map(([c,v]) => `<div class="catrow"><span>${esc(c)}</span><span class="cb"><i style="width:${Math.round(v/spent*100)}%"></i></span><span class="amt" style="font-size:13px">${taka(v)}</span></div>`).join('')}</div>` : ''}
  </section>`;
}

    h += `<section class="paper"><h2>${esc(m.title || 'This session')}</h2>${moneyEntries(m, true)}</section>`;
  }
  const past = S.money.sessions.filter(x => x.end).sort((a,b) => b.end.localeCompare(a.end));
  if (past.length) h += `<section class="paper"><h2>Past sessions</h2>${past.map(x => `<button class="gp" data-act="mOpen" data-id="${x.id}"><span class="gpn"><b>${esc(x.title || shortDay(x.start)+' to '+shortDay(x.end))}</b><span class="muted">Spent ${taka(moneyOut(x))} in ${dayDiff(x.end, x.start)+1} days</span></span><span class="amt ${moneyLeft(x)<0?'':'in'}">${moneyLeft(x)<0?'−':''}${taka(Math.abs(moneyLeft(x)))}</span></button>`).join('')}</section>`;
  return h;
}

/* ---- Settings ---- */
function syncCard(){
  if (!SY.token) return `<section class="paper"><h2>Sync across devices</h2>
    <p class="muted" style="margin:0 0 4px">Uses a private GitHub Gist, same idea as Shelf. Paste a GitHub token with the <b>gist</b> permission. Do the same on your other devices.</p>
    <p style="margin:0 0 8px"><a class="link" href="https://github.com/settings/tokens/new?scopes=gist&description=Mi%20Robo%20Me%20sync&default_expires_at=none" target="_blank" rel="noopener">Make a token on GitHub</a></p>
    <input class="field" id="syTok" type="password" placeholder="ghp_..." autocomplete="off">
    <div class="row"><button class="pbtn" data-act="syConnect">Connect</button></div>
    <p class="muted" style="margin:10px 0 0">Photos stay on each device. Persona stays encrypted in the Gist.</p></section>`;
  const ago = SY.last ? Math.round((Date.now()-SY.last)/60000) : null;
  return `<section class="paper"><h2>Sync across devices</h2>
    <p style="margin:0 0 4px">${syncState ? `<span style="color:var(--danger)">${esc(syncState)}</span>` : 'Connected. Changes upload a few seconds after you make them.'}</p>
    <p class="muted" style="margin:0">${ago == null ? 'Not synced yet' : ago < 1 ? 'Last synced just now' : 'Last synced '+(ago < 60 ? ago+' min' : Math.round(ago/60)+' h')+' ago'}</p>
    <div class="row"><button class="pbtn ghost" data-act="syDisconnect">Disconnect</button><button class="pbtn" data-act="syNow">Sync now</button></div></section>`;
}
function renderSettings(){
  return roomHead('Settings') + syncCard() + `<section class="paper"><h2>Your name</h2><input class="inline" data-b="profile.name" value="${esc(S.profile.name)}" placeholder="Shown on Home"></section>
    <section class="paper"><h2>Look</h2><div class="seg" style="margin:0">${['auto','light','dark'].map(v => `<button class="${S.theme===v?'on':''}" data-act="theme" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div></section>
    <section class="paper"><h2>Backup</h2><p class="muted" style="margin:0 0 12px">Everything lives on this device for now. Copy a backup now and then. Photos stay on the device and are not in the backup.</p>
    <div class="row" style="margin:0"><button class="pbtn ghost" data-act="backup">Copy backup</button><button class="pbtn ghost" data-act="restore">Restore</button></div></section>`;

function setNoteCol(n, col){
  if (n.col === col) return;
  if (col === 2){ n.doneOn = todayKey(); (S.tasks[n.doneOn] = S.tasks[n.doneOn]||[]).push({id:uid(), text:n.text, done:true, board:n.id}); }
  else if (n.col === 2 && n.doneOn){ S.tasks[n.doneOn] = (S.tasks[n.doneOn]||[]).filter(x => x.board !== n.id); n.doneOn = null; }
  n.col = col;
}
function shiftMonth(dir){ const [y,m] = view.month.split('-').map(Number); const d = view.mode === 'month' ? new Date(y, m-1+dir, 1) : new Date(y+dir, m-1, 1); view.month = d.getFullYear()+'-'+pad(d.getMonth()+1); }
function habitForm(h){
  openForm({title: h ? 'Edit habit' : 'New habit', note: h ? '' : 'Habits stay every day, so set it once.',
    fields:[{k:'name',label:'Name',value:h&&h.name,ph:'e.g. Read 20 minutes'},{k:'color',label:'Colour (repeats are fine)',type:'color',value:h ? h.color : COLORS[S.habits.length % COLORS.length]}],
    onSave:v => { if (!v.name){ toast('Give it a name'); return false; } if (h){ h.name = v.name; h.color = v.color; } else S.habits.push({id:uid(), name:v.name, color:v.color}); },
    onDelete: h ? () => { S.habits = S.habits.filter(x => x.id !== h.id); delete S.checks[h.id]; } : null});
}
function personForm(p){
  openForm({title: p ? p.name : 'New person', focus: !p,
    fields:[{k:'name',label:'Name',value:p&&p.name},{k:'where',label:'Where we met',value:p&&p.where},{k:'met',label:'First met',type:'date',value:p&&p.met},{k:'notes',label:'What I notice about them',type:'textarea',rows:10,value:p&&p.notes}],
    onSave: async v => { if (!v.name){ toast('Add a name'); return false; } const t = todayKey();
      if (p) Object.assign(p, v, {updated:t}); else P.list.push(Object.assign({id:uid(), updated:t}, v)); await pSave(); },
    onDelete: p ? async () => { P.list = P.list.filter(x => x.id !== p.id); await pSave(); } : null});
}
function gpForm(g){
  openForm({title: g ? 'Edit '+g.name : 'Log a Grand Prix', focus: !g,
    fields:[{k:'name',label:'Grand Prix',value:g&&g.name,ph:'e.g. Spanish GP'},{k:'round',label:'Round',type:'number',min:1,max:30,value:g&&g.round},{k:'date',label:'Race date',type:'date',value:g&&g.date},
      {k:'status',label:'Did I watch?',type:'select',options:GP_STATUS,value:g?g.status:'Watched live'},
      {k:'rooted',label:'Rooted for',value:g&&g.rooted},{k:'p1',label:'P1',value:g&&g.p1},{k:'p2',label:'P2',value:g&&g.p2},{k:'p3',label:'P3',value:g&&g.p3},
      {k:'dotd',label:'My Driver of the Day vote',value:g&&g.dotd},{k:'loved',label:'Loved',type:'textarea',rows:2,value:g&&g.loved},{k:'hated',label:'Hated',type:'textarea',rows:2,value:g&&g.hated},{k:'notes',label:'Notes',type:'textarea',rows:3,value:g&&g.notes}],
    onSave:v => { if (!v.name){ toast('Name the race'); return false; } if (g) Object.assign(g, v);
      else { const n = Object.assign({id:uid(), season:view.season, rating:0, photos:[]}, v); S.f1.gps.push(n); view.gpId = n.id; } },
    onDelete: g ? () => { (g.photos||[]).forEach(p => IMG.del(p).catch(()=>{})); S.f1.gps = S.f1.gps.filter(x => x.id !== g.id); view.gpId = null; } : null});
}
function noteForm(n){
  openForm({title: n ? 'Edit note' : 'New sticky note', fields:[{k:'text',label:'Task',type:'textarea',rows:3,value:n&&n.text},{k:'col',label:'Where',type:'select',options:[{v:0,n:'To do'},{v:1,n:'Current'},{v:2,n:'Done'}],value:n?n.col:0},{k:'color',label:'Colour',type:'color',value:n?n.color:pick(['yellow','peach','lime','pink','teal'], uid())}],
    onSave:v => { if (!v.text) return false; let t = n; if (t){ t.text = v.text; t.color = v.color; } else { t = {id:uid(), text:v.text, col:0, color:v.color}; S.board.push(t); } setNoteCol(t, +v.col); },
    onDelete: n ? () => { setNoteCol(n, 0); S.board = S.board.filter(x => x.id !== n.id); } : null});
}
function facForm(f){
  openForm({title: f ? f.name : 'New territory', fields:[{k:'name',label:'Territory name',value:f&&f.name},{k:'ruler',label:'Ruled by',value:f&&f.ruler,ph:'Who owns it'},{k:'power',label:'Superpower',value:f&&f.power},{k:'color',label:'Colour',type:'color',value:f?f.color:COLORS[S.map.factions.length % COLORS.length]}],
    onSave:v => { if (!v.name) return false; if (f) Object.assign(f, v); else { const n = Object.assign({id:uid()}, v); S.map.factions.push(n); view.paint = n.id; } },
    onDelete: f ? () => { S.map.factions = S.map.factions.filter(x => x.id !== f.id); for (const k in S.map.tiles) if (S.map.tiles[k] === f.id) delete S.map.tiles[k]; if (view.paint === f.id) view.paint = null; } : null});
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = A[b.dataset.act]; if (!fn) return;
  const r = fn(b, e);
  if (r && typeof r.then === 'function') r.then(x => { if (x !== false) render(); }).catch(() => toast('Something went wrong'));
  else if (r !== false) render();
});
document.addEventListener('input', e => {
  const d = e.target.dataset || {};
  if (d.b){ setPath(d.b, e.target.value); saveSoon(); }
  else if (d.pb && P.list){ const p = P.list.find(x => x.id === view.personId); if (p){ setPath(d.pb, e.target.value, p); p.updated = todayKey(); pSaveSoon(); } }
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.dataset.up !== 'gp' || !el.files.length) return;
  const g = S.f1.gps.find(x => x.id === el.dataset.id); if (!g) return;
  try { for (const file of el.files){ const data = await compress(file), id = 'img_'+uid(); await IMG.put(id, data); (g.photos = g.photos||[]).push(id); } save(); render(); }
  catch(err){ toast('Could not add that photo'); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== 'Escape') return;
  if (e.key === 'Escape'){ closeSheet(); return; }
  const id = e.target.id;
  if (id === 'taskIn'){ e.preventDefault(); A.addTask(); }
  else if (id === 'wishIn'){ e.preventDefault(); A.wishAdd(); }
  else if (id === 'itemIn'){ e.preventDefault(); A.itemAdd(); }
  else if (id === 'mAmt' || id === 'mWhat'){ e.preventDefault(); A.mAdd(); }
  else if (id === 'mStart' || id === 'mTitle'){ e.preventDefault(); if (A.mStart() !== false) render(); }
  else if (id === 'ppu'){ e.preventDefault(); A.pUnlock().then(x => { if (x !== false) render(); }); }
  else if (e.target.closest && e.target.closest('#sheet') && e.target.tagName === 'INPUT'){ e.preventDefault(); A.formSave().then(x => { if (x !== false) render(); }); }
});
$('veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && SY.token) syncNow(true);
  if (document.hidden){ localStorage.setItem(KEY, JSON.stringify(S)); if (syncT){ clearTimeout(syncT); syncPush(); } if (P.list){ pLock(); if (view.tab === 'journal' && view.j === 'persona'){ closeSheet(); render(); } } return; }
  if (todayKey() !== lastToday){ if (view.day === lastToday) view.day = todayKey(); if (view.jday === lastToday) view.jday = todayKey(); lastToday = todayKey(); render(); }
});
setInterval(() => { const t = todayKey(); if (t !== lastToday){ if (view.day === lastToday) view.day = t; if (view.jday === lastToday) view.jday = t; lastToday = t;
  const a = document.activeElement; if (!$('veil').classList.contains('open') && !(a && a.matches && a.matches('input,textarea'))) render(); } }, 20000);

function applyTheme(){ if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); }
const startTab = location.hash.slice(1);
if (['home','days','habits','journal'].includes(startTab)) view.tab = startTab;
const _render = render;
render = function(){ _render(); if (location.hash.slice(1) !== view.tab){ try { history.replaceState(null, '', '#'+view.tab); } catch(e){} } };
applyTheme();
render();
if (SY.token) syncNow(true);
if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
